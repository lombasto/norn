[package]
name = "norn-code"
version = "0.1.0"
edition = "2021"
publish = false

# the code graph (docs/code-graph.md): tree-sitter grammars (C, built by the cc crate: a C compiler is a setup prerequisite)
[dependencies]
tree-sitter = "0.27.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
streaming-iterator = "0.1.9"
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
