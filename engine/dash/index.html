  <span class="spacer"></span>
  <button class="ghost" id="orc" hidden title="SloppaChoppa: call him up" aria-label="SloppaChoppa"></button>
  <button class="ghost" id="look" title="Norn look / classic look">Look: norn</button>
  <button class="ghost" id="theme" title="Light / dark / system">Theme: system</button>

<nav id="tabs" aria-label="Dashboard"></nav>
<div id="error" role="alert"></div>
<div id="dupask" hidden></div>
<main id="main"></main>
<div id="bbar" class="bbar" role="navigation" aria-label="Sections"></div>

  <div id="srcview-body"></div>
</aside>

  <div id="dlv-body"></div>
</aside>
<aside id="rmed" class="drawer" hidden aria-label="Edit the roadmap">

  <div id="rmed-msg" class="small" aria-live="polite"></div>
  <div id="rmed-body"></div>
</aside>
<aside id="dvpip" class="dvpip" hidden role="dialog" aria-label="Diff viewer">

  <div class="dvpip-body" id="dvpip-body"></div>
</aside>

  if (d.act === 'fixresult' && (d.choice === 'discard' || confirm('Apply: a decision + a directive ask the check-in to apply these hunks. Norn edits nothing itself.'))) act(() => post('/api/fixresult', { project: d.project || p, run: d.run, choice: d.choice, skip: [...(S.fxSkip?.[d.run] || [])] }));
  if (d.act === 'fixall-rest') act(() => post('/api/fixall', { project: d.project || p, rest: d.dir }));
  if (d.act === 'audit-decline') act(() => post('/api/audit', { project: d.project || p, id: d.id, verdict: 'decline' }));
  if (d.act === 'advice-keep') act(() => post('/api/advice', { project: p, key: d.key, verdict: 'keep' }));
  if (d.act === 'answer-from') act(async () => { await post('/api/answer', { project: p, id: d.id, from: d.from }); draftDrop(null, '#ans-' + d.id); });
  if (d.act === 'answer-text') { const t = $(`#ans-${CSS.escape(d.id)}`).value.trim(); if (t) act(async () => { await post('/api/answer', { project: d.project || p, id: d.id, text: t }); draftDrop(null, '#ans-' + d.id); }); }   // INBOX-REPLIES: a bare key picks; other words = a message in the Q's thread; a sent answer drops its draft
  if (d.act === 'rule') act(() => post('/api/answer', { project: d.project || p, id: d.id, ruling: Number(d.ruling) }));   // INBOX-REPLIES: one tap confirms the ruling the controller proposed
  if (d.act === 'stop' && confirm(`Stop ${d.run}?`)) act(() => post('/api/stop', { project: p, run: d.run, confirm: true }));
  if (d.act === 'revoke' && confirm(`Revoke ${d.id}?`)) act(() => post('/api/directive/revoke', { project: p, id: d.id }));
  if (d.act === 'overrule') { const t = prompt(`Overrule ${d.id}: what instead?`); if (t) act(() => post('/api/decision/overrule', { project: p, id: d.id, text: t })); }
  if (d.act === 'first-task') { const t = $('#first-task-text').value.trim(); if (t) act(async () => { await post('/api/first-task', { project: d.project || p, text: t }); draftDrop(null, '#first-task-text'); }); }
  if (d.act === 'adv-approve') { dirSend({ project: d.project || p, text: d.text, card: d.id }); return; }   // META-TEND P3; RM-30 S1: one tap, the directive is the record
  if (d.act === 'directive') { const t = prompt('New directive (binds the check-in):'); if (t) dirSend({ project: p, text: t }); return; }   // gap #5: a restatement = the dup notice
  if (d.act === 'dup-close') { S.dupAsk = null; paintDup(); return; }
  if (d.act === 'dup-replace' && S.dupAsk) { dirSend(S.dupAsk, { replace: d.id }); return; }
  if (d.act === 'dup-new' && S.dupAsk) { dirSend(S.dupAsk, { new: true }); return; }
  if (d.act === 'dup-open') { S.dupAsk = null; paintDup(); S.tab = 'records'; S.find = d.id; S.jump = 'rec-' + d.id; history.replaceState(null, '', `?project=${encodeURIComponent(S.project)}&tab=records`); render(); return; }
  if (d.act === 'open-doc') { if (d.project && S.project !== d.project) S.project = d.project; S.tab = 'docs'; S.sub = null; S.doc = d.doc; S.docLine = null; history.pushState(null, '', tabUrl()); render(); return; }   // RM-30 S1: a path chip
  if (d.act === 'copy-path') { navigator.clipboard?.writeText(d.copy).then(() => { b.textContent = '✓'; setTimeout(() => { b.textContent = '⧉'; }, 1200); }, () => err('Copy failed: the browser refused the clipboard')); return; }
  if (d.act === 'prose-more') { const t = b.previousElementSibling, open = !t.classList.contains('open'); t.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open)); b.textContent = open ? 'less' : 'more';
    if (t.dataset.key) { if (open) S.proseOpen.add(t.dataset.key); else S.proseOpen.delete(t.dataset.key); } return; }
  if (d.act === 'settings-review') {   // META-PROFILE-BUG R1: each change in plain words + a flag on a recorded ruling / a retired executor
    const changes = {};
    for (const el of document.querySelectorAll('[data-key]:not([disabled])')) if (changed(el)) changes[el.dataset.key] = valueOf(el);
    const box = $('#settings-diff');
    if (!Object.keys(changes).length) { box.innerHTML = '<p class="small mute">No changes.</p>'; return; }
    post('/api/settings/review', { project: p, version: d.version, changes }).then(r => {   // no re-render: the form keeps its edits
      const flagged = r.lines.filter(l => l.flags.length).length;
      box.innerHTML = `<div class="card" id="settings-review" style="margin-top:10px">${S.setProfile ? `<p class="small">From the profile <b>${esc(S.setProfile.name)}</b> (${esc(S.setProfile.cost)}); Save records the pick.</p>` : ''}<ul class="small">${r.lines.map(l => `<li>${l.flags.length ? '<span class="chip warn">check</span> ' : ''}${esc(l.text)}${l.flags.map(x => `<div class="mute">${esc(x)}</div>`).join('')}</li>`).join('')}</ul>${flagged ? `<p class="small"><b>${flagged} change${flagged === 1 ? '' : 's'} to check</b> before you Save.</p>` : ''}</div><button class="primary" id="settings-save" style="margin-top:8px">Save</button>`;
      $('#settings-save').onclick = () => act(async () => { await post('/api/settings', { project: p, version: d.version, changes, ...(S.setProfile ? { profile: S.setProfile } : {}) }); S.setDirty = 0; S.setVersion = null; S.setProfile = null; });
    }, e => err(e.message));
  }
});
$('#pause').onclick = () => { S.pauseOpen = !S.pauseOpen; S.half = null; pausePaint(); };
// RM-37: the pause menu paints from the last overview (header() repaints it, so an open menu follows the live state)
function pausePaint() { const m = $('#pause-pop'), open = S.pauseOpen && !!S.ov; m.hidden = !open; $('#pause').setAttribute('aria-expanded', String(open));
  if (open) m.innerHTML = pauseMenu(S.ov, { now: Date.parse(S.ov.now), half: S.half }); }
$('#tick').onclick = () => act(() => post('/api/checkin', { project: S.project }));
// ---- META-ADOPT A3: the setup page (Add a project -> What is there -> Reading -> Review -> Set up). Every button is one POST /api/adopt/*
// (or /api/project/new) with the page token; the step is derived from GET /api/adopt, so a reload / another device lands in the same place ----
async function loadProjects() {
  const { projects } = await get('/api/projects');
  S.projects = projects;
  if (S.project && S.project !== 'all' && !projects.some(p => p.name === S.project)) S.project = null;
  if (S.project || !S.adoptAdd) S.project = pickProject(projects, { url: S.project, saved: (() => { try { return localStorage.getItem('meta-project'); } catch { return null; } })() });   // META-HOME-POLISH R1
  $('#project').innerHTML = (projects.length ? '' : '<option value="">no project yet</option>') + projects.map(p => `<option value="${esc(p.name)}">${esc(p.name)} - ${esc(p.title)}</option>`).join('')
    + (projects.length > 1 ? '<option value="all">All projects</option>' : '') + '<option value="+add">+ Add a project</option>';
  $('#project').value = S.project ?? '';
  return projects;
}
const adoptGo = (o = {}) => { S.tab = 'adopt'; S.adoptAsk = o.ask ?? null; S.adoptAdd = !!o.add; S.adoptScan = o.scan ?? null; history.replaceState(null, '', S.project ? `?project=${encodeURIComponent(S.project)}&tab=adopt` : '?tab=adopt'); };
const answers = () => Object.fromEntries([...document.querySelectorAll('#main [data-answer]')].map(x => [x.dataset.answer, x.value.trim()]).filter(([, v]) => v));
async function adoptAct(b, d) {
  const p = d.project || S.project;
  if (d.act === 'adopt-open') { if (d.project) S.project = d.project; adoptGo({ ask: d.ask || null }); render(); return; }
  if (d.act === 'adopt-review') { if (d.project && d.project !== S.project) { S.project = d.project; $('#project').value = S.project; openStream(); } adoptGo(); render(); return; }
  if (d.act === 'adopt-goto') { S.project = d.project; $('#project').value = S.project; adoptGo(); openStream(); render(); return; }
  if (d.act === 'adopt-again') { adoptGo({ ask: 'scan' }); render(); return; }
  if (d.act === 'adopt-later') { S.tab = 'overview'; history.replaceState(null, '', `?project=${encodeURIComponent(S.project)}&tab=overview`); await render(); err('Saved: every decision is recorded as you make it. "Review the draft setup" waits in Needs you.'); return; }
  if (d.act === 'adopt-use') { const box = $('#main [data-adopt="root"]'); if (box) box.value = d.root; }
  if (d.act === 'adopt-use' || d.act === 'adopt-scan') {
    const root = $('#main [data-adopt="root"]')?.value.trim();
    if (!root) { err('Type the folder of a git repository first.'); return; }
    b.disabled = true; b.textContent = 'Looking ...';
    try {
      const r = await post('/api/adopt/scan', { root });
      if (r.registered) { S.project = r.registered; $('#project').value = S.project; adoptGo(); openStream(); }
      else adoptGo({ scan: { project: null, root, facts: r.facts, interview: r.interview, consent: r.consent, proposal: null, read: null } });
      draftDrop('adopt'); err(''); await render();
    } catch (e) { err(e.message); b.disabled = false; b.textContent = 'Look at it'; }
    return;
  }
  if (d.act === 'adopt-read' || d.act === 'adopt-facts') {
    const read = d.act === 'adopt-read', a = answers();
    b.disabled = true; b.textContent = read ? 'Starting the read ...' : 'Drafting ...';
    await act(async () => {
      let project = S.project;
      if (S.adoptScan) {   // not a project yet: register it first (project.json beside the others, outside the repository)
        const r = await post('/api/project/new', { root: S.adoptScan.root });
        project = S.project = r.project; await loadProjects(); openStream();
      }
      await post('/api/adopt/draft', { project, read, answers: a });
      S.adoptScan = null; S.adoptAsk = null; S.adoptAdd = false; draftDrop('adopt');
      history.replaceState(null, '', `?project=${encodeURIComponent(S.project)}&tab=adopt`);
    });
    return;
  }
  if (d.act === 'adopt-edit') {
    const t = prompt('Edit this line (one line; the draft keeps the original):', d.text); if (t === null || !t.trim()) return;
    (S.adoptEdits[d.part] ||= {})[d.line] = t.trim(); paintMain(S.last); return;
  }
  if (d.act === 'adopt-decide') {
    const card = b.closest('section[data-part]'), part = card.dataset.part, body = { project: p, part, verdict: d.verdict, sha: card.dataset.sha };
    const radio = card.querySelector('input[type=radio]:checked');
    if (card.querySelector('input[type=radio]')) { if (d.verdict === 'approve') { if (!radio) { err('Pick one line first: it is never decided for you.'); return; } body.pick = radio.dataset.line; } }
    else {
      const boxes = [...card.querySelectorAll('input[type=checkbox][data-line]:not([disabled])')];
      body.off = boxes.filter(x => !x.checked).map(x => x.dataset.line);
      body.on = boxes.filter(x => x.checked && x.dataset.unverified).map(x => x.dataset.line);
    }
    if (S.adoptEdits[part] && Object.keys(S.adoptEdits[part]).length) body.edits = S.adoptEdits[part];
    try { const r = await post('/api/adopt/decide', body); delete S.adoptEdits[part]; draftDrop('adopt'); err(''); S.last = { ...S.last, proposal: r.proposal }; paintMain(S.last); document.getElementById('part-' + part)?.scrollIntoView({ block: 'nearest' }); }
    catch (e) { err(/changed since/.test(e.message) ? e.message + ' (the page reloads the draft)' : e.message); if (/changed since/.test(e.message)) render(); }
    return;
  }
  if (d.act === 'adopt-apply') {
    const n = (S.last?.proposal?.parts || []).filter(x => x.status === 'approved' && !x.applied).length;
    if (!confirm(`Apply ${n} approved part(s)? Records and files beside project.json are written; your repository is not touched.`)) return;
    b.disabled = true; act(async () => { await post('/api/adopt/apply', { project: p }); S.adoptAsk = null; }); return;
  }
  if (d.act === 'adopt-notnow') { const why = prompt('Not now: why? (recorded; the draft is offered again only when you ask)', 'not now'); if (why === null) return; act(() => post('/api/adopt/close', { project: p, why: why.trim() || 'not now' })); return; }
  if (d.act === 'adopt-rule') { const t = prompt('One rule every worker reads (written to rules/RULES.md beside project.json):'); if (t && t.trim()) act(() => post('/api/adopt/rule', { project: p, text: t.trim() })); return; }
  if (d.act === 'adopt-caps-keep') { if (confirm('Keep the starter caps? This records your choice; the scheduler stays off.')) act(() => post('/api/adopt/caps', { project: p })); return; }
  if (d.act === 'setup-gate') { act(() => post('/api/adopt/gate', { project: p, cmd: d.cmd, version: d.version })); return; }
  if (d.act === 'adopt-start') { act(async () => { await post('/api/checkin', { project: p }); err(''); }); return; }
  if (d.act === 'adopt-rehearse') { act(async () => { await post('/api/adopt/rehearse', { project: p, lane: d.lane }); }); return; }
}
$('#project').onchange = e => {
  if (e.target.value === '+add') { e.target.value = S.project ?? ''; adoptGo({ add: true }); render(); return; }
  S.adoptAdd = false; S.adoptScan = null; S.adoptAsk = null;
  S.project = e.target.value; S.doc = null; S.docLine = null; if (S.project && S.project !== 'all') { try { localStorage.setItem('meta-project', S.project); } catch { /* private mode */ } } history.replaceState(null, '', `?project=${encodeURIComponent(S.project)}&tab=${S.tab}`); openStream(); render(); };
(async () => {
  try {
    step('projects'); await loadProjects();
  } catch (e) { err('Cannot load projects: ' + e.message); return; }
  step('stream'); if (S.project) openStream(); else S.tab = 'adopt';
  await render();
})();
</script>
