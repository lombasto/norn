# norn smoke + node tests on the three desktop OSes (META-GENERAL-DESIGN section 8).
# Hosted-runner minutes on a private repo are spending (owner-only): this runs ONLY on demand or on a push to main (after the merge,
# with ci.yml's full suite) - never on a lane branch push. A pull request runs the fast check instead (pr.yml, META-PR-FAST RM-29).
name: smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: norn smoke
        run: node engine/bin/norn.mjs smoke
      - name: SETUP.md walked (guide.test)
        run: node --test tests/guide.test.mjs
