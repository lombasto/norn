# META-PR-FAST (RM-29): the fast check of a pull request, target < 3 min wall: three jobs side by side on one Linux runner each -
# slop (`norn slop check` of the PR's diff: exit 1 = an open BLOCK finding), norn smoke, and the tests of the files the PR changes
# (`ci-suite --changed`: lib/cisuite.mjs pickTests). The full suite runs after the merge (ci.yml: push to main + nightly), never here.
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # slop (RM-44 stage B, audit D2): the PR head's diff from its merge base with the target, the rules of a lane's run end; the owner
  # makes `slop` a required status (engine/lib/slop/rules/README.md). This workflow has no path filter on purpose: a required status
  # a filter skips stays pending and blocks the PR. --ci skips the rules flagged `machine` in their data (K14 reads the machine's
  # generated files; a runner has none). META_ROOT pins Norn's tool cache (<META_ROOT>/state/tools, tools.mjs): the check installs
  # the locked tool set tools/lint (npm ci --ignore-scripts) once per lock, and actions/cache carries it to the next run. META_ROOT
  # is set on the step because a job's env has no `runner` context and GitHub rejects the whole file for it (the PR check did not
  # run from 11-20 to this fix).
  # Norn's Rust parts (slop: norn-code, the code graph the imports rules such as K10 read; smoke and tests: all three, the picked tests can
  # hold the graph tests, slop-lang / slop-kinds, and the hook's): one step pattern in the three jobs,
  # Norn's own build (rustbin.mjs ensurePart: cargo build --release --locked into the clone's store <.git>/norn/rust, the binary named
  # by its source hash) with the runner's cargo (ubuntu-latest ships rustup; the repo pins no toolchain). actions/cache carries the
  # store's bin/ keyed by the parts' sources (target/ left out, as sourceHash does), so a PR that does not touch Rust builds nothing;
  # on a miss the step builds and the cache stores the binary. A part that cannot be had fails the step: a rule that cannot run is no pass.
  slop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/norn/state/tools
          key: slop-tools-${{ runner.os }}-${{ hashFiles('tools/lint/package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: .git/norn/rust/bin
          key: rust-code-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/code-rs/**', '!engine/code-rs/target/**') }}
      - name: Norn's Rust parts (norn-code) - ensurePart, built only on a cache miss
        env:
          PARTS: code
        shell: bash
        run: |
          cargo --version
          node --input-type=module -e '
            import { ensurePart, binOf } from "./engine/lib/rustbin.mjs";
            for (const p of process.env.PARTS.split(" ")) {
              const t0 = Date.now(), r = ensurePart(p, { err: s => console.error(s), start: () => console.log("building " + p) });
              if (!r.ok) { console.error(r.why); process.exit(1); }
              console.log(p + ": " + binOf(p) + (r.built ? " built" : " cached") + " in " + ((Date.now() - t0) / 1000).toFixed(1) + " s");
            }'
      - name: slop check of the PR's diff from its merge base
        env:
          META_ROOT: ${{ runner.temp }}/norn
        shell: bash
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          node engine/bin/norn.mjs slop check --ci --diff "$base..HEAD"
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .git/norn/rust/bin
          key: rust-hook-code-jobguard-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/hook-rs/**', '!engine/hook-rs/target/**', 'engine/code-rs/**', '!engine/code-rs/target/**', 'engine/jobguard-rs/**', '!engine/jobguard-rs/target/**') }}
      - name: Norn's Rust parts (norn-hook, norn-code, norn-jobguard) - ensurePart, built only on a cache miss
        env:
          PARTS: hook code jobguard
        shell: bash
        run: |
          cargo --version
          node --input-type=module -e '
            import { ensurePart, binOf } from "./engine/lib/rustbin.mjs";
            for (const p of process.env.PARTS.split(" ")) {
              const t0 = Date.now(), r = ensurePart(p, { err: s => console.error(s), start: () => console.log("building " + p) });
              if (!r.ok) { console.error(r.why); process.exit(1); }
              console.log(p + ": " + binOf(p) + (r.built ? " built" : " cached") + " in " + ((Date.now() - t0) / 1000).toFixed(1) + " s");
            }'
      - name: norn smoke
        shell: bash
        run: node engine/bin/norn.mjs smoke
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .git/norn/rust/bin
          key: rust-hook-code-jobguard-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/hook-rs/**', '!engine/hook-rs/target/**', 'engine/code-rs/**', '!engine/code-rs/target/**', 'engine/jobguard-rs/**', '!engine/jobguard-rs/target/**') }}
      - name: Norn's Rust parts (norn-hook, norn-code, norn-jobguard) - ensurePart, built only on a cache miss
        env:
          PARTS: hook code jobguard
        shell: bash
        run: |
          cargo --version
          node --input-type=module -e '
            import { ensurePart, binOf } from "./engine/lib/rustbin.mjs";
            for (const p of process.env.PARTS.split(" ")) {
              const t0 = Date.now(), r = ensurePart(p, { err: s => console.error(s), start: () => console.log("building " + p) });
              if (!r.ok) { console.error(r.why); process.exit(1); }
              console.log(p + ": " + binOf(p) + (r.built ? " built" : " cached") + " in " + ((Date.now() - t0) / 1000).toFixed(1) + " s");
            }'
      # Chromium's Linux SUID sandbox: the dash tests start a browser; see ci.yml for the why.
      - name: configure the browsers' SUID sandbox helper
        shell: bash
        run: |
          for b in microsoft-edge microsoft-edge-stable google-chrome google-chrome-stable chromium chromium-browser; do
            exe=$(command -v "$b") || continue
            dir=$(dirname "$(readlink -f "$exe")")
            for h in msedge-sandbox chrome-sandbox chrome_sandbox; do
              [ -f "$dir/$h" ] || continue
              sudo chown root:root "$dir/$h" && sudo chmod 4755 "$dir/$h"
              ls -l "$dir/$h"
            done
          done
      - name: the tests of the changed files (fails only on a red not in tests/KNOWN-REDS.txt)
        shell: bash
        run: node engine/bin/ci-suite.mjs --changed "origin/${{ github.base_ref }}" --concurrency 4
