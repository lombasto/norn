# The full node suite on GitHub-hosted runners (Windows + Linux) after the merge: on a push to main and nightly. A pull request runs
# the fast check instead (pr.yml, META-PR-FAST RM-29): slop, smoke and the tests of the files it changes.
# engine/bin/ci-suite.mjs fails only on a red NOT listed in tests/KNOWN-REDS.txt. Before the suite, norn-hook and norn-code are built
# once through rustbin ensurePart (cached by their sources) and norn-code (engine/code-rs, the code graph: docs/code-graph.md) is
# gated: test, fmt and clippy with --locked in that build's target dir; macOS runs that step only, for norn-code (DEC-a-574).
name: ci

# A docs-only push (markdown / docs / images / html) runs no suite; the nightly runs regardless.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/docs/**'
      - '**/*.png'
      - '**/*.html'
  schedule:
    - cron: '0 6 * * *'
  # a dispatch with census=true also counts the git and node processes each test file starts (ci-suite --census; it costs time)
  workflow_dispatch:
    inputs:
      census:
        description: 'count the git and node processes per test file (ci-suite --census)'
        type: boolean
        default: false

permissions:
  contents: read

# RM-26 S0 (DEC-a-651 Q6): a dispatch is its own group (a push cannot cancel a baseline), and a push to main never cancels a running
# suite: the newer run waits. ci.yml has no pull_request trigger, so nothing here cancels.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        code_rs_only: [false]
        include:
          - os: macos-latest
            code_rs_only: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .git/norn/rust/bin
          key: rust-hook-code-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/hook-rs/**', '!engine/hook-rs/target/**', 'engine/code-rs/**', '!engine/code-rs/target/**') }}
      # RM-26 S2: the one build of each part per job is Norn's own (rustbin ensurePart, as pr.yml), so the suite's rustReady finds the
      # content-named binary and builds nothing; norn-code's test, fmt and clippy run in ensurePart's target dir (targetOf), so the
      # crate's dependencies compile once per job. macOS gates norn-code only.
      - name: Norn's Rust parts (norn-hook, norn-code) - ensurePart, then norn-code's test, fmt, clippy in its target dir
        env:
          PARTS: ${{ matrix.code_rs_only && 'code' || 'hook code' }}
        shell: bash
        run: |
          rustup component add rustfmt clippy
          cargo --version
          node --input-type=module -e '
            import { ensurePart, binOf } from "./engine/lib/rustbin.mjs";
            for (const p of process.env.PARTS.split(" ")) {
              const t0 = Date.now(), r = ensurePart(p, { err: s => console.error(s), start: () => console.log("building " + p) });
              if (!r.ok) { console.error(r.why); process.exit(1); }
              console.log(p + ": " + binOf(p) + (r.built ? " built" : " cached") + " in " + ((Date.now() - t0) / 1000).toFixed(1) + " s");
            }'
          export CARGO_TARGET_DIR="$(node --input-type=module -e 'import { targetOf } from "./engine/lib/rustbin.mjs"; console.log(targetOf("code"))')"
          cd engine/code-rs
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      # Chromium's Linux SUID sandbox: the helper beside each browser (Edge's msedge-sandbox, Chrome's chrome-sandbox) must be
      # owned by root with mode 4755, else the browser aborts rather than run unsandboxed (setuid_sandbox_host.cc; "Linux SUID
      # Sandbox", https://chromium.googlesource.com/chromium/src/+/main/docs/linux/suid_sandbox_development.md). The sandbox stays on.
      - name: configure the browsers' SUID sandbox helper (Linux)
        if: runner.os == 'Linux' && !matrix.code_rs_only
        shell: bash
        run: |
          for b in microsoft-edge microsoft-edge-stable google-chrome google-chrome-stable chromium chromium-browser; do
            exe=$(command -v "$b") || continue
            dir=$(dirname "$(readlink -f "$exe")")
            for h in msedge-sandbox chrome-sandbox chrome_sandbox; do
              [ -f "$dir/$h" ] || continue
              sudo chown root:root "$dir/$h" && sudo chmod 4755 "$dir/$h"
              ls -l "$dir/$h"
            done
          done
      # RM-26 S5: the parallel phase at concurrency 4, as pr.yml (it is throughput-bound); smoke still runs alone after it (DEC-78)
      - name: suite (fails only on a red not in tests/KNOWN-REDS.txt)
        if: ${{ !matrix.code_rs_only }}
        shell: bash
        env:
          CENSUS: ${{ github.event_name == 'workflow_dispatch' && inputs.census && '--census' || '' }}
        run: node engine/bin/ci-suite.mjs --concurrency 4 --json "$RUNNER_TEMP/ci-times.json" $CENSUS
      # RM-26 S0: one time row per test file (wall_ms, cases_ms, outside_ms, cases; with the census git_procs, node_procs)
      - name: upload the per-file times
        if: ${{ always() && !matrix.code_rs_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-times-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-times.json
